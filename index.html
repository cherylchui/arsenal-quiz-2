        type: "order",
        badge: "賽事年代排序",
        question: "【球會榮譽時間軸】請將阿仙奴奪得以下 4 次 FA Cup 足總盃冠軍嘅年份「由舊至最新」排列：",
        items: [
          "2014 年 (勝侯城 3:2)",
          "2015 年 (勝阿士東維拉 4:0)",
          "2017 年 (勝車路士 2:1)",
          "2020 年 (勝車路士 2:1)"
        ],
        correctOrderIndices: [0, 1, 2, 3],
        explanation: "阿仙奴近 15 年 4 次足總盃封王時間軸分別為：2014 年 ➔ 2015 年 ➔ 2017 年 ➔ 2020 年！"
      },

      // Q13: MC
      {
        id: 13,
        type: "mc",
        badge: "球員號碼考驗",
        question: "德國多面手哈伐斯（Kai Havertz）於 2023 年夏天加盟阿仙奴後，身穿哪一個球衣號碼？",
        options: [
          "9 號",
          "29 號",
          "14 號",
          "23 號"
        ],
        answer: 1,
        explanation: "哈伐斯加盟兵工廠後繼續延續佢職業生涯嘅幸運號碼——身穿 29 號球衣！"
      },

      // Q14: MATCHING
      {
        id: 14,
        type: "matching",
        badge: "球星位置配對",
        question: "【陣容位置】請將以下現役阿仙奴主力球員與其場上主要位置正確配對：",
        pairs: [
          { left: "大衛拿耶 (David Raya)", right: "守門員 (GK)" },
          { left: "加比爾馬加希斯 (Gabriel Magalhães)", right: "中堅 (CB)" },
          { left: "布卡約薩卡 (Bukayo Saka)", right: "右翼 (RW)" },
          { left: "梅列克 (Mikel Merino)", right: "中場 (CM)" }
        ],
        explanation: "拿耶鎮守獨木關；加比爾與薩利巴組成頂級中堅塔；薩卡為右路爆破手；梅列克（Merino）則於 2024 夏季加盟強化中場制空與抗壓！"
      },

      // Q15: MC (Declan Rice Jersey Fix: #41)
      {
        id: 15,
        type: "mc",
        badge: "球衣號碼定海神針",
        question: "2023 年夏天阿仙奴以打破球會轉會費紀錄（1.05 億鎊）簽入英格蘭中場樞紐迪肯賴斯（Declan Rice）。請問佢喺阿仙奴身穿嘅球衣號碼係？",
        options: [
          "41 號",
          "4 號",
          "6 號",
          "8 號"
        ],
        answer: 0,
        explanation: "迪肯賴斯加盟阿仙奴後，堅持繼續選用自青訓時期起一直伴隨佢成長嘅標誌性 41 號球衣（Jersey #41）！"
      }
    ];

    // State Variables
    let currentQuestionIndex = 0;
    let score = 0;

    // Interactive State Variables
    let matchingSelectedLeft = null;
    let matchingUserPairs = {}; // leftIndex -> rightIndex
    let currentOrderList = [];  // Array of item indices

    // Elements
    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');

    const questionText = document.getElementById('question-text');
    const questionNumber = document.getElementById('question-number');
    const questionBadge = document.getElementById('question-badge');
    const scoreCount = document.getElementById('score-count');
    const progressBar = document.getElementById('progress');
    const interactionArea = document.getElementById('quiz-interaction-area');

    const explanationDiv = document.getElementById('explanation');
    const explanationText = document.getElementById('explanation-text');

    const actionBtn = document.getElementById('action-btn');
    const actionBtnText = document.getElementById('action-btn-text');
    const actionBtnIcon = document.getElementById('action-btn-icon');

    function startGame() {
      currentQuestionIndex = 0;
      score = 0;
      startScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      loadQuestion();
    }

    function loadQuestion() {
      resetState();
      const q = questions[currentQuestionIndex];

      // Header Meta Updates
      questionText.innerText = q.question;
      questionNumber.querySelector('span').innerText = `問題 ${currentQuestionIndex + 1}/15`;
      questionBadge.innerText = q.badge;
      scoreCount.querySelector('span').innerText = `得分: ${score}`;

      // Progress bar
      const progressPercent = ((currentQuestionIndex + 1) / questions.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // Render based on Question Type
      if (q.type === 'mc') {
        renderMC(q);
      } else if (q.type === 'matching') {
        renderMatching(q);
      } else if (q.type === 'order') {
        renderOrder(q);
      }
    }

    function resetState() {
      interactionArea.innerHTML = '';
      explanationDiv.classList.add('hidden');
      actionBtn.classList.add('hidden');
      matchingSelectedLeft = null;
      matchingUserPairs = {};
      currentOrderList = [];
    }

    /* ----------------------------------------------------
       TYPE 1: MULTIPLE CHOICE (MC)
    ---------------------------------------------------- */
    function renderMC(q) {
      const container = document.createElement('div');
      container.className = 'grid grid-cols-1 gap-3';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'glass-option w-full p-4 rounded-2xl text-left font-semibold text-slate-100 flex items-center justify-between group animate-pop';
        btn.style.animationDelay = `${idx * 0.06}s`;

        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center text-xs font-bold text-gunnersGold group-hover:bg-gunnersRed group-hover:text-white transition-colors">
              ${String.fromCharCode(65 + idx)}
            </span>
            <span class="text-sm md:text-base">${opt}</span>
          </div>
          <i class="fa-regular fa-circle text-slate-500 group-hover:text-white transition-colors"></i>
        `;

        btn.addEventListener('click', () => handleMCSelection(idx, btn));
        container.appendChild(btn);
      });

      interactionArea.appendChild(container);
    }

    function handleMCSelection(selectedIndex, selectedBtn) {
      const q = questions[currentQuestionIndex];
      const allButtons = interactionArea.querySelectorAll('button');

      allButtons.forEach(btn => {
        btn.disabled = true;
        btn.style.cursor = 'default';
      });

      if (selectedIndex === q.answer) {
        score++;
        selectedBtn.classList.add('correct');
        selectedBtn.querySelector('i').className = 'fa-solid fa-circle-check text-green-400';
      } else {
        selectedBtn.classList.add('wrong', 'animate-shake');
        selectedBtn.querySelector('i').className = 'fa-solid fa-circle-xmark text-red-400';

        // Highlight correct option
        const correctBtn = allButtons[q.answer];
        correctBtn.classList.add('correct');
        correctBtn.querySelector('i').className = 'fa-solid fa-circle-check text-green-400';
      }

      scoreCount.querySelector('span').innerText = `得分: ${score}`;
      showExplanation(q.explanation);
      setupNextButton();
    }

    /* ----------------------------------------------------
       TYPE 2: MATCHING PAIRS
    ---------------------------------------------------- */
    // Shuffle helper
    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderMatching(q) {
      // Store shuffled right side mappings
      if (!q._shuffledRight) {
        const rightItems = q.pairs.map((p, i) => ({ text: p.right, originalIdx: i }));
        q._shuffledRight = shuffleArray(rightItems);
      }

      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-4';

      // Left Column
      const leftCol = document.createElement('div');
      leftCol.className = 'space-y-2.5';
      const leftHeader = document.createElement('div');
      leftHeader.className = 'text-xs font-bold text-gunnersGold mb-2 uppercase tracking-wider flex items-center gap-1.5';
      leftHeader.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> 1. 點擊選擇左邊項目';
      leftCol.appendChild(leftHeader);

      q.pairs.forEach((pair, leftIdx) => {
        const btn = document.createElement('button');
        btn.id = `match-left-${leftIdx}`;
        btn.className = 'glass-option w-full p-3.5 rounded-xl text-left text-xs md:text-sm font-semibold flex items-center justify-between border border-white/10';
        btn.innerHTML = `<span>${pair.left}</span> <i class="fa-regular fa-circle text-slate-500 text-xs"></i>`;
        btn.addEventListener('click', () => handleMatchingLeftClick(leftIdx));
        leftCol.appendChild(btn);
      });

      // Right Column
      const rightCol = document.createElement('div');
      rightCol.className = 'space-y-2.5';
      const rightHeader = document.createElement('div');
      rightHeader.className = 'text-xs font-bold text-gunnersGold mb-2 uppercase tracking-wider flex items-center gap-1.5';
      rightHeader.innerHTML = '<i class="fa-solid fa-link"></i> 2. 再點擊右邊連線';
      rightCol.appendChild(rightHeader);

      q._shuffledRight.forEach((item, rightDisplayIdx) => {
        const btn = document.createElement('button');
        btn.id = `match-right-${rightDisplayIdx}`;
        btn.className = 'glass-option w-full p-3.5 rounded-xl text-left text-xs md:text-sm font-semibold flex items-center justify-between border border-white/10';
        btn.innerHTML = `<span>${item.text}</span> <i class="fa-regular fa-circle text-slate-500 text-xs"></i>`;
        btn.addEventListener('click', () => handleMatchingRightClick(rightDisplayIdx, item.originalIdx));
        rightCol.appendChild(btn);
      });

      grid.appendChild(leftCol);
      grid.appendChild(rightCol);
      interactionArea.appendChild(grid);

      // Submit matching button setup
      actionBtnText.innerText = '提交配對答案';
      actionBtnIcon.className = 'fa-solid fa-check text-xs';
      actionBtn.classList.remove('hidden');
    }

    function handleMatchingLeftClick(leftIdx) {
      if (actionBtnText.innerText === '下一條問題') return; // disabled if submitted

      matchingSelectedLeft = leftIdx;
      
      // Highlight selected left button
      const q = questions[currentQuestionIndex];
      q.pairs.forEach((_, idx) => {
        const btn = document.getElementById(`match-left-${idx}`);
        if (idx === leftIdx) {
          btn.classList.add('selected-pair');
        } else if (matchingUserPairs[idx] === undefined) {
          btn.classList.remove('selected-pair');
        }
      });
    }

    function handleMatchingRightClick(rightDisplayIdx, originalRightIdx) {
      if (actionBtnText.innerText === '下一條問題') return;
      if (matchingSelectedLeft === null) return;

      const leftIdx = matchingSelectedLeft;
      matchingUserPairs[leftIdx] = originalRightIdx;

      // Visual updates for paired items
      const leftBtn = document.getElementById(`match-left-${leftIdx}`);
      const rightBtn = document.getElementById(`match-right-${rightDisplayIdx}`);

      leftBtn.className = 'glass-option w-full p-3.5 rounded-xl text-left text-xs md:text-sm font-semibold flex items-center justify-between border border-gunnersGold bg-gunnersGold/20 text-gunnersGold';
      leftBtn.querySelector('i').className = 'fa-solid fa-link text-gunnersGold text-xs';

      rightBtn.className = 'glass-option w-full p-3.5 rounded-xl text-left text-xs md:text-sm font-semibold flex items-center justify-between border border-gunnersGold bg-gunnersGold/20 text-gunnersGold';
      rightBtn.querySelector('i').className = 'fa-solid fa-link text-gunnersGold text-xs';

      matchingSelectedLeft = null;
    }

    function submitMatchingAnswer() {
      const q = questions[currentQuestionIndex];
      let correctCount = 0;
      const totalPairs = q.pairs.length;

      // Evaluate paired
      for (let i = 0; i < totalPairs; i++) {
        if (matchingUserPairs[i] === i) {
          correctCount++;
        }
      }

      // Mark visual feedback
      q.pairs.forEach((_, leftIdx) => {
        const leftBtn = document.getElementById(`match-left-${leftIdx}`);
        const userMatchedRightIdx = matchingUserPairs[leftIdx];

        if (userMatchedRightIdx === leftIdx) {
          leftBtn.className = 'glass-option w-full p-3.5 rounded-xl text-left text-xs md:text-sm font-semibold flex items-center justify-between correct';
          leftBtn.querySelector('i').className = 'fa-solid fa-circle-check text-green-400 text-xs';
        } else {
          leftBtn.className = 'glass-option w-full p-3.5 rounded-xl text-left text-xs md:text-sm font-semibold flex items-center justify-between wrong';
          leftBtn.querySelector('i').className = 'fa-solid fa-circle-xmark text-red-400 text-xs';
        }
      });

      // Disable buttons
      q.pairs.forEach((_, idx) => {
        const lBtn = document.getElementById(`match-left-${idx}`);
        if (lBtn) lBtn.disabled = true;
      });
      q._shuffledRight.forEach((_, idx) => {
        const rBtn = document.getElementById(`match-right-${idx}`);
        if (rBtn) rBtn.disabled = true;
      });

      if (correctCount === totalPairs) {
        score++;
      }

      scoreCount.querySelector('span').innerText = `得分: ${score}`;
      showExplanation(q.explanation);
      setupNextButton();
    }

    /* ----------------------------------------------------
       TYPE 3: DRAG / RE-ORDER RANKING
    ---------------------------------------------------- */
    function renderOrder(q) {
      if (!q._currentIndices) {
        // Shuffle starting order
        q._currentIndices = shuffleArray([0, 1, 2, 3]);
      }
      currentOrderList = [...q._currentIndices];

      const container = document.createElement('div');
      container.id = 'order-list-container';
      container.className = 'space-y-3';

      renderOrderItems(container, q);

      interactionArea.appendChild(container);

      // Action button setup
      actionBtnText.innerText = '確認排序';
      actionBtnIcon.className = 'fa-solid fa-check text-xs';
      actionBtn.classList.remove('hidden');
    }

    function renderOrderItems(container, q) {
      container.innerHTML = '';

      currentOrderList.forEach((itemIdx, pos) => {
        const itemText = q.items[itemIdx];
        const card = document.createElement('div');
        card.className = 'glass-option p-3.5 rounded-2xl flex items-center justify-between border border-white/10 animate-pop';

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-lg bg-gunnersRed/30 text-gunnersGold text-xs font-bold flex items-center justify-center border border-gunnersRed/50">
              ${pos + 1}
            </span>
            <span class="text-xs md:text-sm font-semibold text-slate-100">${itemText}</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="moveOrderItem(${pos}, -1)" ${pos === 0 ? 'disabled class="opacity-30 p-2 text-slate-400"' : 'class="p-2 text-gunnersGold hover:bg-white/10 rounded-lg transition-colors"'}>
              <i class="fa-solid fa-arrow-up"></i>
            </button>
            <button onclick="moveOrderItem(${pos}, 1)" ${pos === currentOrderList.length - 1 ? 'disabled class="opacity-30 p-2 text-slate-400"' : 'class="p-2 text-gunnersGold hover:bg-white/10 rounded-lg transition-colors"'}>
              <i class="fa-solid fa-arrow-down"></i>
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function moveOrderItem(pos, direction) {
      if (actionBtnText.innerText === '下一條問題') return;

      const newPos = pos + direction;
      if (newPos < 0 || newPos >= currentOrderList.length) return;

      // Swap
      const temp = currentOrderList[pos];
      currentOrderList[pos] = currentOrderList[newPos];
      currentOrderList[newPos] = temp;

      const q = questions[currentQuestionIndex];
      q._currentIndices = [...currentOrderList];
      const container = document.getElementById('order-list-container');
      if (container) {
        renderOrderItems(container, q);
      }
    }

    function submitOrderAnswer() {
      const q = questions[currentQuestionIndex];
      const isCorrect = JSON.stringify(currentOrderList) === JSON.stringify(q.correctOrderIndices);

      const container = document.getElementById('order-list-container');
      const cards = container.children;

      currentOrderList.forEach((itemIdx, pos) => {
        const card = cards[pos];
        if (itemIdx === q.correctOrderIndices[pos]) {
          card.className = 'glass-option p-3.5 rounded-2xl flex items-center justify-between correct mb-2';
        } else {
          card.className = 'glass-option p-3.5 rounded-2xl flex items-center justify-between wrong mb-2';
        }
      });

      if (isCorrect) {
        score++;
      }

      scoreCount.querySelector('span').innerText = `得分: ${score}`;
      showExplanation(q.explanation);
      setupNextButton();
    }

    /* ----------------------------------------------------
       COMMON ACTIONS & FLOW
    ---------------------------------------------------- */
    function handleActionClick() {
      const q = questions[currentQuestionIndex];

      if (actionBtnText.innerText === '提交配對答案') {
        submitMatchingAnswer();
      } else if (actionBtnText.innerText === '確認排序') {
        submitOrderAnswer();
      } else if (actionBtnText.innerText === '下一條問題') {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }
    }

    function showExplanation(text) {
      explanationText.innerText = text;
      explanationDiv.classList.remove('hidden');
    }

    function setupNextButton() {
      actionBtnText.innerText = '下一條問題';
      actionBtnIcon.className = 'fa-solid fa-chevron-right text-xs';
      actionBtn.classList.remove('hidden');
    }

    function showResults() {
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');

      document.getElementById('final-score').innerText = score;
      const rankTitle = document.getElementById('rank-title');
      const rankDesc = document.getElementById('rank-desc');
      const rankIcon = document.getElementById('rank-icon');

      if (score === 15) {
        rankTitle.innerText = "🏆 酋長球場傳奇 (Legend)";
        rankDesc.innerText = "滿分！神級槍迷！你對阿仙奴戰術數據、精密時間戳、轉會紀錄及近 15 年歷史聊如指掌，血統比雲格同阿迪達更加純正！COYG！🔴⚪";
        rankIcon.className = "fa-solid fa-trophy";
        triggerConfetti();
      } else if (score >= 12) {
        rankTitle.innerText = "⭐ 核心主力球員 (First Team)";
        rankDesc.innerText = "極之出色！你絕對係阿仙奴資深死忠，連首 10 條魔鬼戰術與數據題都難唔倒你！";
        rankIcon.className = "fa-solid fa-medal";
        triggerConfetti();
      } else if (score >= 8) {
        rankTitle.innerText = "🧢 輪換主力 (Squad Player)";
        rankDesc.innerText = "表現唔錯！基本大事你都好清楚，不過有啲硬核細節與精確數據可以溫習多啲！";
        rankIcon.className = "fa-solid fa-shield";
      } else {
        rankTitle.innerText = "👶 海布里青年軍 (Academy Player)";
        rankDesc.innerText = "繼續努力！死忠之路漫漫，即刻再去睇多啲精華重溫與戰術分析！";
        rankIcon.className = "fa-solid fa-seedling";
      }
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#DB0007', '#FFD700', '#ffffff', '#06141F']
        });
      }
    }
  </script>
</body>
</html>
